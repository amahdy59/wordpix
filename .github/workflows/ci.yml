name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm run test

      - name: Coverage report (report-only, no thresholds yet)
        run: pnpm run test:coverage

      - name: Build Application
        run: pnpm run build
        env:
          # Public asset origin used by the production build. Keeping CI on
          # the same asset topology catches broken R2 paths before deployment.
          VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}

      - name: Bundle analysis (report-only)
        run: pnpm run analyze

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-stats
          path: dist/bundle-stats.html
          retention-days: 10

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Both the production build and the later ANALYZE rebuild must use the
      # same public asset origin. The analysis step overwrites dist before E2E.
      VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret and dependency security checks
        run: pnpm run check:security

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Coverage report (report-only, no thresholds yet)
        run: pnpm run test:coverage

      - name: Build Application
        run: pnpm run build

      - name: Bundle analysis (report-only)
        run: pnpm run analyze

      - name: Enforce bundle budgets
        run: pnpm run check:bundle

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: coverage/
          retention-days: 10

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-stats
          path: dist/bundle-stats.html
          retention-days: 10

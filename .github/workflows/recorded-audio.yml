name: Fill immutable recorded audio
on:
  workflow_call:
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements-recorded-audio.txt
      - name: Plan using existing R2 objects
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pnpm exec tsx scripts/plan_recorded_audio.ts
      - name: Select twelve genuinely missing recordings
        run: |
          node -e 'const fs=require("fs"); const plan=require("./output/recorded-audio/plan.json"); plan.rows=plan.rows.filter(item=>!item.existingKey).slice(0,12); fs.writeFileSync("output/recorded-audio/pilot-plan.json",JSON.stringify(plan));'
          node scripts/generate_recorded_audio.cjs --plan=output/recorded-audio/pilot-plan.json
      - name: Validate the Edge service and create-only uploads
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          WORDPIX_EDGE_CONCURRENCY: "2"
        run: node scripts/generate_recorded_audio.cjs --plan=output/recorded-audio/pilot-plan.json --execute
      - uses: actions/upload-artifact@v7
        with:
          name: edge-recording-plan
          path: output/recorded-audio/plan.json
          retention-days: 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-receipts-pilot
          path: output/recorded-audio/upload-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 10
  generate:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements-recorded-audio.txt
      - uses: actions/download-artifact@v8
        with:
          name: edge-recording-plan
          path: output/recorded-audio
      - name: Seed verified receipts and partition immutable keys
        env:
          RECORDING_LANE: ${{ matrix.lane }}
        run: |
          node -e 'const fs=require("fs"); const plan=require("./output/recorded-audio/plan.json"); const lane=Number(process.env.RECORDING_LANE); if(!Number.isInteger(lane)||lane<0||lane>=8)throw Error("Invalid lane"); plan.rows=plan.rows.filter(item=>parseInt(item.edgeKey.split("/").at(-1).slice(0,2),16)%8===lane); fs.writeFileSync("output/recorded-audio/lane-plan.json",JSON.stringify(plan)); fs.copyFileSync("assets/edge-recording-receipts.jsonl","output/recorded-audio/upload-receipts.jsonl");'
          node scripts/generate_recorded_audio.cjs --plan=output/recorded-audio/lane-plan.json
      - name: Fill missing recordings with no replacement writes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          WORDPIX_EDGE_CONCURRENCY: "2"
        run: node scripts/generate_recorded_audio.cjs --plan=output/recorded-audio/lane-plan.json --execute
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-receipts-${{ matrix.lane }}
          path: output/recorded-audio/upload-receipts.jsonl
          retention-days: 10
  reconcile:
    needs: [pilot, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: edge-recording-plan
          path: output/recorded-audio
      - uses: actions/download-artifact@v8
        with:
          pattern: edge-receipts-*
          path: output/recorded-audio/lanes
      - name: Merge verified upload receipts
        run: |
          node -e 'const fs=require("fs"),path=require("path"); const rows=new Map(); function read(file){if(!fs.existsSync(file))return;for(const line of fs.readFileSync(file,"utf8").trim().split(/\r?\n/).filter(Boolean)){const item=JSON.parse(line);if(item.status==="verified")rows.set(item.key,item)}} read("assets/edge-recording-receipts.jsonl");for(const lane of fs.readdirSync("output/recorded-audio/lanes"))read(path.join("output/recorded-audio/lanes",lane,"upload-receipts.jsonl"));fs.writeFileSync("output/recorded-audio/upload-receipts.jsonl",[...rows.values()].map(item=>JSON.stringify(item)).join("\n")+"\n");'
      - name: Link verified recordings and require complete coverage
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          node scripts/link_recorded_audio.cjs
          node scripts/verify_recorded_audio.cjs --require-complete
          node scripts/check_recorded_audio_readiness.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: complete-recorded-audio
          path: |
            output/recorded-audio/plan.json
            output/recorded-audio/upload-receipts.jsonl
            output/recorded-audio/verification.json
            src/app/generated/additionalAudioRecordings.json
            src/app/generated/additionalRecordings/
            src/app/generated/edgeRecordings/
            src/app/generated/recordedAudioCoverage.json
          retention-days: 10

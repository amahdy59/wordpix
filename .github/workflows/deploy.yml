name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Validation runs for every push and pull request. It deliberately declares
  # no `environment`: a job-level environment is evaluated before the runner is
  # assigned, and the github-pages environment only permits deployments from
  # main — so on a pull request the whole job was rejected in about a second,
  # with no runner, no steps, and no logs. The deploy steps were already
  # guarded by an `if`, but the guard never got the chance to run.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint Gate
        run: pnpm run lint

      - name: Run Type Check Gate
        run: pnpm run typecheck

      - name: Run Unit Tests Gate
        run: pnpm test

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build project
        run: pnpm run build
        env:
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_ID: "Xb7hH8MSUJpSbSDYk0k2"

      - name: Copy index.html to 404.html for SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Only this job touches the protected environment, and only from main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Scoped to the deploy job so a burst of pull request validations cannot
    # cancel each other over a group they never use.
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

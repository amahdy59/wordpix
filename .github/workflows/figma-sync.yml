name: Sync content from Figma

# Runs the Figma import on a GitHub runner, which has unrestricted outbound
# access. Developer machines work too, but sandboxed environments (including
# Claude Code web sessions) have egress policies that refuse every figma.com
# host, so this workflow is the reliable path.
#
# Requires a repository secret named FIGMA_TOKEN — a Figma personal access
# token with read access to the design file. Settings → Secrets and variables
# → Actions → New repository secret.
#
# The result lands on a branch and opens a pull request; nothing is pushed
# straight to main, so the diff can be reviewed before it ships.

on:
  workflow_dispatch:
    inputs:
      units:
        description: 'Units to sync, space separated (blank = all 182)'
        required: false
        default: ''
      images:
        description: 'Download artwork'
        type: boolean
        default: true
      content:
        description: 'Dump learning-material JSON'
        type: boolean
        default: true
      force:
        description: 'Re-download artwork that is already real'
        type: boolean
        default: false
      max_width:
        description: 'Downscale card artwork wider than this'
        required: false
        default: '1024'
      scene_width:
        description: 'Downscale scene artwork wider than this'
        required: false
        default: '1920'
      quality:
        description: 'AVIF quality (lower is smaller; 55 is the tuned default)'
        required: false
        default: '55'
      include_new:
        description: 'Also fetch units Figma has that the app does not'
        type: boolean
        default: false
      debug_pairing:
        description: 'Print frame geometry for diagnosing unit/materials pairing'
        type: boolean
        default: false
      dry_run:
        description: 'Report only, write nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # A full run fetches roughly ten thousand images and encodes every one of
    # them to AVIF, which is several times slower than the webp it replaced.
    # The webp import finished inside two hours; this needs the headroom, and
    # 350 still stops a hung fetch short of the six-hour ceiling.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # sharp is a devDependency and needs its native binary, so the repo's
        # usual ignored build scripts are allowed through here.
        run: |
          pnpm install --frozen-lockfile
          pnpm rebuild sharp

      - name: Run sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::FIGMA_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          args=""
          [ "${{ inputs.images }}" = "true" ] && args="$args --images"
          [ "${{ inputs.content }}" = "true" ] && args="$args --content"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.include_new }}" = "true" ] && args="$args --include-new"
          [ "${{ inputs.debug_pairing }}" = "true" ] && args="$args --debug-pairing"
          args="$args --max-width ${{ inputs.max_width }}"
          args="$args --scene-width ${{ inputs.scene_width }}"
          args="$args --quality ${{ inputs.quality }}"

          for unit in ${{ inputs.units }}; do
            args="$args --unit $unit"
          done

          echo "figma-sync$args"
          node scripts/figma-sync.mjs $args

      - name: Repoint the data at the new artwork
        if: inputs.images && inputs.dry_run != true
        run: |
          # Only paths with a real file behind them are switched, so a card the
          # sync could not render keeps the artwork it still has rather than
          # becoming a broken image.
          node scripts/retarget-artwork-paths.mjs --ext avif
          node scripts/prune-superseded-artwork.mjs --ext avif

      - name: Report what changed
        id: changes
        run: |
          added=$(git status --porcelain public figma-dump src/app/data/lessons.ts | wc -l)
          echo "count=$added" >> "$GITHUB_OUTPUT"

          # GitHub Pages refuses to publish a site over 1 GB, and artwork is
          # nearly all of this one. Measuring here turns "the deploy failed a
          # week later" into a number on the run that produced it.
          bytes=$(du -sb public | cut -f1)
          mb=$((bytes / 1024 / 1024))
          echo "size_mb=$mb" >> "$GITHUB_OUTPUT"

          {
            echo "### Figma sync"
            echo ""
            echo "- $added file(s) changed"
            echo "- \`public/\` is now ${mb} MB"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$mb" -gt 950 ]; then
            echo "::error::public/ is ${mb} MB, at or over the 1 GB GitHub Pages limit. Re-run with a lower --quality or --max-width."
            exit 1
          fi
          if [ "$mb" -gt 700 ]; then
            echo "::warning::public/ is ${mb} MB, approaching the 1 GB GitHub Pages limit."
          fi

      - name: Open a pull request
        if: steps.changes.outputs.count != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/figma-sync-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public figma-dump src/app/data/lessons.ts
          git commit -m "chore(assets): sync artwork and content from Figma

          Ran scripts/figma-sync.mjs via the Sync content from Figma workflow.
          ${{ steps.changes.outputs.count }} file(s) changed."
          git push -u origin "$branch"

          # Creating a pull request from Actions requires "Allow GitHub Actions
          # to create and approve pull requests". When that is off the push has
          # still succeeded and is the part that matters, so report the branch
          # instead of failing the run.
          gh pr create \
            --title "chore(assets): sync artwork and content from Figma" \
            --body "Automated run of \`scripts/figma-sync.mjs\` (workflow run #${{ github.run_number }}).

          ${{ steps.changes.outputs.count }} file(s) changed. \`public/\` is now ${{ steps.changes.outputs.size_mb }} MB.

          Check before merging: the placeholder ratchet in \`image_asset_integrity.test.ts\` should drop, no real artwork should be replaced by a placeholder, and the size above should stay well clear of the 1 GB GitHub Pages limit.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" \
            --base main \
            --head "$branch" || {
            echo "::warning::Could not open a pull request automatically. Branch $branch is pushed — open the PR manually."
            echo "Branch \`$branch\` pushed. Open a pull request for it manually." >> "$GITHUB_STEP_SUMMARY"
          }

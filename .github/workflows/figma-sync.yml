name: Sync content from Figma

# Runs the Figma import on a GitHub runner, which has unrestricted outbound
# access. Developer machines work too, but sandboxed environments (including
# Claude Code web sessions) have egress policies that refuse every figma.com
# host, so this workflow is the reliable path.
#
# Requires a repository secret named FIGMA_TOKEN — a Figma personal access
# token with read access to the design file. Settings → Secrets and variables
# → Actions → New repository secret.
#
# The result lands on a branch and opens a pull request; nothing is pushed
# straight to main, so the diff can be reviewed before it ships.

on:
  workflow_dispatch:
    inputs:
      units:
        description: 'Units to sync, space separated (blank = all 182)'
        required: false
        default: ''
      images:
        description: 'Download artwork'
        type: boolean
        default: true
      content:
        description: 'Dump learning-material JSON'
        type: boolean
        default: true
      force:
        description: 'Re-download artwork that is already real'
        type: boolean
        default: false
      max_width:
        description: 'Downscale card artwork wider than this'
        required: false
        default: '480'
      scene_width:
        description: 'Downscale scene artwork wider than this'
        required: false
        default: '1600'
      include_new:
        description: 'Also fetch units Figma has that the app does not'
        type: boolean
        default: false
      dry_run:
        description: 'Report only, write nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # A full run fetches roughly ten thousand images; the default 360 minutes
    # is plenty, but be explicit so a hung fetch cannot idle for six hours.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # sharp is a devDependency and needs its native binary, so the repo's
        # usual ignored build scripts are allowed through here.
        run: |
          pnpm install --frozen-lockfile
          pnpm rebuild sharp

      - name: Run sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::FIGMA_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          args=""
          [ "${{ inputs.images }}" = "true" ] && args="$args --images"
          [ "${{ inputs.content }}" = "true" ] && args="$args --content"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.include_new }}" = "true" ] && args="$args --include-new"
          args="$args --max-width ${{ inputs.max_width }}"
          args="$args --scene-width ${{ inputs.scene_width }}"

          for unit in ${{ inputs.units }}; do
            args="$args --unit $unit"
          done

          echo "figma-sync$args"
          node scripts/figma-sync.mjs $args

      - name: Report what changed
        id: changes
        run: |
          added=$(git status --porcelain public figma-dump | wc -l)
          echo "count=$added" >> "$GITHUB_OUTPUT"
          echo "### Figma sync" >> "$GITHUB_STEP_SUMMARY"
          echo "$added file(s) changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.changes.outputs.count != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/figma-sync-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public figma-dump
          git commit -m "chore(assets): sync artwork and content from Figma

          Ran scripts/figma-sync.mjs via the Sync content from Figma workflow.
          ${{ steps.changes.outputs.count }} file(s) changed."
          git push -u origin "$branch"

          # Creating a pull request from Actions requires "Allow GitHub Actions
          # to create and approve pull requests". When that is off the push has
          # still succeeded and is the part that matters, so report the branch
          # instead of failing the run.
          gh pr create \
            --title "chore(assets): sync artwork and content from Figma" \
            --body "Automated run of \`scripts/figma-sync.mjs\` (workflow run #${{ github.run_number }}).

          ${{ steps.changes.outputs.count }} file(s) changed.

          Check before merging: the placeholder ratchet in \`image_asset_integrity.test.ts\` should drop, and no real artwork should be replaced by a placeholder.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" \
            --base main \
            --head "$branch" || {
            echo "::warning::Could not open a pull request automatically. Branch $branch is pushed — open the PR manually."
            echo "Branch \`$branch\` pushed. Open a pull request for it manually." >> "$GITHUB_STEP_SUMMARY"
          }

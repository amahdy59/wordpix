name: Generate audio

# Synthesises the audio corpus into R2, in bounded tranches.
#
# Manual by default, and deliberately so. This is the one workflow in the
# repository that spends money — ElevenLabs bills per character — so it does
# not run on push, and every run states a character budget it will not exceed.
#
# Running it twice is safe and nearly free. Keys are content-addressed, the
# committed ledger records what has already been paid for, and anything absent
# from the ledger is checked against the bucket before a single character is
# spent. The reconcile step below closes the remaining gap: it drops ledger
# entries whose object is not actually in the bucket, so a clip can never be
# skipped forever on the strength of a stale record.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which corpus tier to generate"
        type: choice
        default: words
        options:
          - words
          - materials
          - lexicon
          - stories
          - all
      max_chars:
        description: "Hard character budget for this run"
        default: "80000"
      dry_run:
        description: "Price the run without calling anything"
        type: boolean
        default: true

  # A monthly top-up so newly added vocabulary gets a voice without anyone
  # remembering to ask. Scoped to `words` and a small budget: the tier a
  # learner actually hears on every card, at a cost that cannot surprise.
  schedule:
    - cron: "0 3 1 * *"

concurrency:
  # Two runs writing the ledger would each commit a partial view of it.
  group: audio-generation
  cancel-in-progress: false

jobs:
  generate:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      # The ledger is committed back so the next run knows what this one bought.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the corpus
        run: node scripts/build_audio_corpus.cjs

      - name: Reconcile the ledger against the bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/generate_audio.cjs --reconcile

      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # The scheduled run has no inputs, so it takes the cheap defaults.
          TIER: ${{ inputs.tier || 'words' }}
          MAX_CHARS: ${{ inputs.max_chars || '80000' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--max-chars=$MAX_CHARS"
          if [ "$TIER" != "all" ]; then args="$args --tier=$TIER"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          echo "node scripts/generate_audio.cjs $args"
          node scripts/generate_audio.cjs $args

      - name: Commit the ledger
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- assets/audio-ledger.json; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio-ledger.json
          git commit -m "chore(audio): record clips generated by workflow run ${{ github.run_number }}"
          git push

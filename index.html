<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordPix - Learn English Through Pictures</title>
    <meta name="description" content="Interactive English vocabulary learning app through picture exploration, audio pronunciation, and interactive exercises for adult learners." />
    <meta name="robots" content="index, follow" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!--
      Applies the stored theme before first paint. Without this the class is
      only added once React mounts, so every dark-mode user gets a white flash
      on each load. Must stay inline and blocking — a deferred module runs too
      late to prevent it.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wordpix:theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* Blocked storage: fall through to the light default. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
